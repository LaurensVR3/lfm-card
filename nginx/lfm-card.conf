# Example nginx config for hosting LFM Card. Drop it in /etc/nginx/conf.d/
# (it replaces default.conf) and put the contents of web/ at <root>/lfm-card/.
#
# The overlays load /fonts/GeneralSans-*.woff2, /logo.svg and /favicon.svg from
# the site root. See the README for where to get them or how to swap them out.

# /lfm-card/<id>?layout=... -> which overlay page to serve.
map $arg_layout $lfm_page {
    lower-third    /lfm-card/lower-third.html;
    starting-soon  /lfm-card/starting-soon.html;
    default        /lfm-card/card.html;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # OBS overlays: /lfm-card/<lfm user id>[?layout=...] -> one page per layout
    # that reads the id from the URL. /lfm-card/ itself is the manual (index.html).
    location ~ ^/lfm-card/\d+/?$ {
        add_header Cache-Control "no-cache";
        try_files $lfm_page =404;
    }

    # Overlay code and the manual: always revalidate so OBS picks up updates.
    location ~ ^/lfm-card/(.*\.(js|css|html))?$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Same-origin proxy for the official LFM card HTML: the only source of the
    # next-race info, and not CORS-enabled. Restricted to numeric ids so it
    # isn't an open proxy.
    location ~ ^/lfm-api/lfmlicense/\d+$ {
        rewrite ^/lfm-api/(.*)$ /$1 break;
        proxy_pass https://api.lowfuelmotorsport.de;
        proxy_set_header Host api.lowfuelmotorsport.de;
        proxy_ssl_server_name on;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store";
    }
}
