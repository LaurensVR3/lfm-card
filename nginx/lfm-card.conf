# Example nginx config for hosting LFM Card. Drop it in /etc/nginx/conf.d/
# (it replaces default.conf) and put the contents of web/ at <root>/lfm-card/.
#
# The overlays load /fonts/GeneralSans-*.woff2, /logo.svg and /favicon.svg from
# the site root. See the README for where to get them or how to swap them out.

# Cache for LFM's YouTube streams page (see /lfm-api/youtube-streams below).
proxy_cache_path /var/cache/nginx/lfm keys_zone=lfm:1m max_size=50m inactive=1h;

# /lfm-card/<id>?layout=... -> which overlay page to serve.
map $arg_layout $lfm_page {
    lower-third    /lfm-card/lower-third.html;
    starting-soon  /lfm-card/starting-soon.html;
    default        /lfm-card/card.html;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # OBS overlays: /lfm-card/<lfm user id>[?layout=...] -> one page per layout
    # that reads the id from the URL. /lfm-card/ itself is the manual (index.html).
    location ~ ^/lfm-card/\d+/?$ {
        add_header Cache-Control "no-cache";
        try_files $lfm_page =404;
    }

    # Overlay code and the manual: always revalidate so OBS picks up updates.
    location ~ ^/lfm-card/(.*\.(js|css|html))?$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Same-origin proxy for the official LFM card HTML: a fallback for the
    # next-race info when LFM's widget JSON fails. Not CORS-enabled, so it goes
    # through here. Restricted to numeric ids so it isn't an open proxy.
    location ~ ^/lfm-api/lfmlicense/\d+$ {
        rewrite ^/lfm-api/(.*)$ /$1 break;
        proxy_pass https://api.lowfuelmotorsport.de;
        proxy_set_header Host api.lowfuelmotorsport.de;
        proxy_ssl_server_name on;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store";
    }

    # LFM's YouTube streams tab (scheduled + live broadcasts), for the starting
    # soon scene. Fixed upstream URL, cached 10 min so overlays don't hit YouTube.
    # Optional: without it the scene just shows no YouTube broadcast.
    location = /lfm-api/youtube-streams {
        proxy_pass https://www.youtube.com/@LowFuelMotorsport/streams;
        proxy_set_header Host www.youtube.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # YouTube sends very large response headers.
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36";
        proxy_set_header Accept-Language "en-US,en;q=0.9";
        proxy_set_header Accept-Encoding "gzip";
        gunzip on;
        proxy_set_header Cookie "SOCS=CAI; CONSENT=YES+1";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache lfm;
        proxy_cache_key youtube-streams;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header Cache-Control "no-store";
    }
}
